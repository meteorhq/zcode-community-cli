name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and verify but skip the actual npm publish"
        type: boolean
        default: false

# Shared with auto-release.yml so a scheduled publish and a manual publish
# can never race each other on npm.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Required for npm --provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g pnpm@10.33.2

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('upstream.json') }}

      - name: Install packaging repo dependencies
        run: npm install --no-fund --no-audit

      - name: Build from upstream source (auto clone)
        run: node scripts/build-package.mjs

      - name: Verify package
        run: npm run verify

      - name: Publish
        if: ${{ !inputs.dry-run }}
        # --tag latest is required: -N packaging-revision versions are semver
        # prereleases, and npm refuses to publish those to the default tag
        # without an explicit choice. They are the newest builds, so latest
        # is the intended dist-tag.
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
